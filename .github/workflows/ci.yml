name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q kakao_qgis_bridge
      - name: Run Bandit security scan
        run: |
          python -m pip install --disable-pip-version-check bandit
          python -m bandit -r kakao_qgis_bridge
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate viewer JavaScript
        run: node scripts/check_viewer_js.js
      - name: Test viewer and external bridge client
        run: node --test tests/external_bridge_client.test.js tests/viewer_roadview_sync.test.js tests/viewer_search.test.js tests/viewer_guidance.test.js tests/viewer_history.test.js tests/viewer_page.test.js tests/viewer_route_input.test.js
      - name: Build plugin ZIP
        run: python scripts/build_plugin.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: kakao_qgis_bridge
          path: dist/kakao_qgis_bridge.zip
