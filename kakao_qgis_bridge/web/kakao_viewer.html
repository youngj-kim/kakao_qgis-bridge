<!doctype html>
<html lang="ko" class="centered-viewer">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kakao Map Viewer</title>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f4;
      color: #1f2428;
    }

    #viewer {
      display: grid;
      --split-primary-size: 50%;
      grid-template-rows:
        auto
        minmax(0, var(--split-primary-size))
        10px
        minmax(0, 1fr)
        auto;
      grid-template-columns: minmax(0, 1fr);
      height: 100%;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    #viewer.layout-map-top {
      grid-template-rows:
        auto
        minmax(0, var(--split-primary-size))
        10px
        minmax(0, 1fr)
        auto;
      grid-template-columns: minmax(0, 1fr);
    }

    #viewer.layout-roadview-top {
      grid-template-rows:
        auto
        minmax(0, var(--split-primary-size))
        10px
        minmax(0, 1fr)
        auto;
      grid-template-columns: minmax(0, 1fr);
    }

    #viewer.layout-map-left,
    #viewer.layout-roadview-left {
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-columns:
        minmax(240px, var(--split-primary-size))
        10px
        minmax(240px, 1fr);
    }

    #search-panel,
    #status-bar {
      grid-column: 1 / -1;
    }

    #viewer.layout-map-top #map,
    #viewer.layout-roadview-top #roadview {
      grid-row: 2;
    }

    #viewer.layout-map-top #roadview,
    #viewer.layout-roadview-top #map {
      grid-row: 4;
    }

    #view-splitter {
      grid-row: 3;
      grid-column: 1;
    }

    #viewer.layout-map-left #map,
    #viewer.layout-roadview-left #roadview {
      grid-row: 2;
      grid-column: 1;
    }

    #viewer.layout-map-left #roadview,
    #viewer.layout-roadview-left #map {
      grid-row: 2;
      grid-column: 3;
    }

    #viewer.layout-map-left #view-splitter,
    #viewer.layout-roadview-left #view-splitter {
      grid-row: 2;
      grid-column: 2;
    }

    #view-splitter {
      position: relative;
      z-index: 15;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: inset 0 0 0 1px rgba(31, 36, 40, 0.08);
      touch-action: none;
    }

    #viewer.layout-map-top #view-splitter,
    #viewer.layout-roadview-top #view-splitter {
      cursor: row-resize;
    }

    #viewer.layout-map-left #view-splitter,
    #viewer.layout-roadview-left #view-splitter {
      cursor: col-resize;
    }

    #split-toggle {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(70, 83, 93, 0.35);
      border-radius: 999px;
      background: #ffffff;
      color: #263238;
      font: inherit;
      font-size: 18px;
      line-height: 1;
      box-shadow: 0 2px 8px rgba(31, 36, 40, 0.16);
      cursor: pointer;
    }

    #split-toggle:hover {
      background: #f3f6f8;
    }

    html.centered-viewer,
    html.centered-viewer body {
      min-height: 100%;
      background: #e6e8ea;
    }

    html.centered-viewer #viewer {
      width: min(100vw, 1280px);
      height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      background: #f7f7f4;
      box-shadow: 0 0 0 1px rgba(31, 36, 40, 0.08),
        0 18px 42px rgba(31, 36, 40, 0.18);
    }

    @media (min-width: 1440px) {
      html.centered-viewer #viewer {
        width: min(74vw, 1320px);
      }
    }

    #search-panel {
      position: relative;
      z-index: 20;
      padding: 7px 8px;
      border-bottom: 1px solid #d7d7d0;
      background: #ffffff;
    }

    #search-form {
      display: grid;
      grid-template-areas: "query submit layout fullscreen clear";
      grid-template-columns: minmax(0, 1fr) auto auto 34px 34px;
      gap: 6px;
    }

    #search-query {
      grid-area: query;
      min-width: 0;
      height: 34px;
      padding: 0 9px;
      border: 1px solid #aeb4b8;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2428;
      font: inherit;
      font-size: 13px;
    }

    #search-query:focus {
      border-color: #4b77be;
      outline: 2px solid rgba(75, 119, 190, 0.2);
      outline-offset: 0;
    }

    #viewer-layout,
    #fullscreen-toggle,
    #search-submit,
    #search-clear {
      height: 34px;
      border: 1px solid #90979c;
      border-radius: 6px;
      background: #f3f4f4;
      color: #1f2428;
      font: inherit;
      cursor: pointer;
    }

    #viewer-layout {
      grid-area: layout;
      min-width: 120px;
      max-width: 100%;
      padding: 0 8px;
      background: #ffffff;
      font-size: 12px;
    }

    #search-submit {
      grid-area: submit;
      min-width: 54px;
      padding: 0 12px;
      background: #ffffff;
      font-size: 13px;
      font-weight: 600;
    }

    #search-clear {
      grid-area: clear;
      width: 34px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }

    #fullscreen-toggle {
      grid-area: fullscreen;
      width: 34px;
      padding: 0;
      font-size: 17px;
      line-height: 1;
    }

    #viewer-layout:hover,
    #fullscreen-toggle:hover,
    #search-submit:hover,
    #search-clear:hover {
      background: #e8eaeb;
    }

    #search-submit:disabled,
    #search-clear:disabled,
    #search-query:disabled {
      cursor: default;
      opacity: 0.55;
    }

    #search-results {
      position: absolute;
      top: calc(100% - 1px);
      right: 8px;
      left: 8px;
      max-height: min(42vh, 320px);
      overflow-y: auto;
      border: 1px solid #aeb4b8;
      border-radius: 0 0 6px 6px;
      background: #ffffff;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.16);
    }

    #search-results[hidden] {
      display: none;
    }

    #route-controls {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 6px;
      margin-top: 6px;
    }

    .route-label {
      align-self: center;
      min-width: 34px;
      color: #4c555a;
      font-size: 11px;
      font-weight: 600;
      text-align: center;
    }

    .route-input {
      min-width: 0;
      height: 32px;
      padding: 0 8px;
      border: 1px solid #aeb4b8;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2428;
      font: inherit;
      font-size: 12px;
    }

    .route-input:focus {
      border-color: #4b77be;
      outline: 2px solid rgba(75, 119, 190, 0.2);
      outline-offset: 0;
    }

    #route-options,
    .route-waypoint {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 6px;
    }

    #route-options {
      grid-template-columns: auto minmax(0, 1fr) auto auto auto;
    }

    #route-avoid-options {
      display: flex;
      grid-column: 1 / -1;
      flex-wrap: wrap;
      gap: 4px 12px;
      padding: 4px 6px 5px 40px;
      border-bottom: 1px solid #e3e5e6;
    }

    #route-avoid-options[hidden] {
      display: none;
    }

    #route-vehicle-options {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: auto minmax(92px, 1fr) auto minmax(76px, 1fr) auto;
      align-items: center;
      gap: 6px;
      padding: 4px 6px 5px 40px;
      border-bottom: 1px solid #e3e5e6;
    }

    #route-vehicle-options[hidden] {
      display: none;
    }

    .route-vehicle-label {
      color: #4c555a;
      font-size: 11px;
      font-weight: 600;
    }

    .route-avoid-option {
      display: inline-flex;
      min-height: 24px;
      align-items: center;
      gap: 5px;
      color: #3f474c;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
    }

    .route-avoid-option input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: #2b5f9e;
    }

    #route-priority,
    #route-car-type,
    #route-car-fuel {
      min-width: 0;
      height: 32px;
      padding: 0 8px;
      border: 1px solid #aeb4b8;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2428;
      font: inherit;
      font-size: 12px;
    }

    #route-priority:focus,
    #route-car-type:focus,
    #route-car-fuel:focus {
      border-color: #4b77be;
      outline: 2px solid rgba(75, 119, 190, 0.2);
      outline-offset: 0;
    }

    #route-waypoints {
      display: grid;
      grid-column: 1 / -1;
      gap: 6px;
    }

    .route-waypoint {
      grid-template-columns: auto minmax(0, 1fr) auto auto 32px;
    }

    .route-waypoint-order {
      display: grid;
      grid-template-columns: 28px 28px;
      gap: 2px;
    }

    .route-waypoint-order button {
      width: 28px;
      padding: 0 !important;
      font-size: 16px !important;
    }

    .route-waypoint-remove {
      width: 32px;
      padding: 0 !important;
      font-size: 18px !important;
    }

    #route-controls button,
    #route-actions button {
      min-width: 0;
      height: 32px;
      overflow: hidden;
      padding: 0 8px;
      border: 1px solid #aeb4b8;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2428;
      font: inherit;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    #route-controls button:hover,
    #route-actions button:hover {
      background: #edf2f7;
    }

    #route-controls button:disabled,
    #route-actions button:disabled,
    .route-input:disabled,
    #route-priority:disabled,
    #route-car-type:disabled,
    #route-car-fuel:disabled {
      cursor: default;
      opacity: 0.5;
    }

    #route-actions {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: minmax(0, 1fr) 88px 34px 34px;
      gap: 6px;
    }

    #route-create {
      border-color: #2b5f9e !important;
      background: #2b5f9e !important;
      color: #ffffff !important;
    }

    #route-history-open,
    #route-swap,
    #route-reset {
      padding: 0 !important;
    }

    #route-swap,
    #route-reset {
      width: 34px;
      font-size: 18px !important;
    }

    #route-guidance-panel {
      margin: 7px -8px -7px;
      border-top: 1px solid #d7d7d0;
      background: #ffffff;
    }

    #route-guidance-panel[hidden] {
      display: none;
    }

    #route-guidance-summary {
      display: flex;
      min-height: 38px;
      align-items: center;
      gap: 8px;
      padding: 5px 8px 5px 12px;
      border-bottom: 1px solid #e3e5e6;
    }

    #route-panel-tabs {
      display: inline-flex;
      flex: 0 0 auto;
      overflow: hidden;
      border: 1px solid #c6ccd1;
      border-radius: 6px;
      background: #f8f9fa;
    }

    .route-panel-tab {
      min-width: 48px;
      height: 28px;
      padding: 0 8px;
      border: 0;
      border-right: 1px solid #c6ccd1;
      background: transparent;
      color: #3f474d;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .route-panel-tab:last-child {
      border-right: 0;
    }

    .route-panel-tab.is-active {
      background: #2b5f9e;
      color: #ffffff;
      font-weight: 600;
    }

    #route-guidance-summary-text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      font-size: 12px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #route-guidance-toggle {
      width: 30px;
      height: 30px;
      padding: 0;
      border: 1px solid #aeb4b8;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2428;
      font: inherit;
      font-size: 18px;
      cursor: pointer;
    }

    #route-guidance-list,
    #route-history-list {
      max-height: min(28vh, 260px);
      overflow-y: auto;
    }

    #route-guidance-overview {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid #e3e5e6;
      background: #f8fafb;
    }

    .route-overview-point {
      display: inline-flex;
      min-width: 0;
      align-items: center;
      gap: 5px;
      padding: 4px 7px;
      border: 1px solid #d4d9de;
      border-radius: 999px;
      background: #ffffff;
      color: #1f2428;
      font-size: 11px;
      line-height: 1.25;
    }

    .route-overview-role {
      flex: 0 0 auto;
      font-weight: 700;
    }

    .route-overview-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #route-guidance-panel[data-collapsed="true"] #route-guidance-list,
    #route-guidance-panel[data-collapsed="true"] #route-guidance-overview,
    #route-guidance-panel[data-collapsed="true"] #route-history-list,
    #route-guidance-list[hidden],
    #route-guidance-overview[hidden],
    #route-history-list[hidden] {
      display: none;
    }

    .guidance-item,
    .history-item {
      display: grid;
      width: 100%;
      min-height: 54px;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      border: 0;
      border-bottom: 1px solid #eceeed;
      background: #ffffff;
      color: #1f2428;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .guidance-item {
      grid-template-columns: 30px 28px minmax(0, 1fr);
    }

    .history-item {
      grid-template-columns: 26px minmax(0, 1fr);
    }

    .history-bulk-actions {
      display: flex;
      min-height: 38px;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-bottom: 1px solid #e3e5e6;
      background: #f8fafb;
    }

    .history-bulk-summary {
      flex: 1;
      min-width: 0;
      color: #3f474d;
      font-size: 12px;
      font-weight: 600;
    }

    .history-select {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #2b5f9e;
      cursor: pointer;
    }

    .history-actions {
      display: flex;
      gap: 5px;
      margin-top: 6px;
    }

    .history-bulk-actions button,
    .history-actions button {
      min-height: 26px;
      padding: 3px 8px;
      border: 1px solid #b8c1c8;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2428;
      font: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    .history-bulk-actions button:disabled {
      cursor: default;
      opacity: 0.5;
    }

    .history-content {
      min-width: 0;
    }

    .history-actions button:hover,
    .history-actions button:focus {
      border-color: #2b5f9e;
      color: #174d86;
      outline: none;
    }

    .guidance-item:hover,
    .guidance-item:focus,
    .guidance-item.is-active,
    .history-item:hover,
    .history-item:focus,
    .history-item.is-active {
      background: #edf4fc;
      outline: none;
    }

    .guidance-sequence {
      color: #727a7f;
      font-size: 11px;
      text-align: center;
    }

    .guidance-icon {
      display: inline-flex;
      width: 28px;
      height: 28px;
      align-items: center;
      justify-content: center;
      border: 2px solid #1976d2;
      border-radius: 50%;
      color: #185aa8;
      font-size: 17px;
      font-weight: 700;
      line-height: 1;
    }

    .guidance-icon.start,
    .guidance-icon.destination,
    .guidance-icon.waypoint {
      border: 0;
      color: #ffffff;
      font-size: 11px;
    }

    .guidance-icon.start {
      background: #2e7d32;
    }

    .guidance-icon.destination {
      background: #d32f2f;
    }

    .guidance-icon.waypoint {
      background: #f9a825;
    }

    .guidance-copy {
      min-width: 0;
    }

    .guidance-title,
    .guidance-meta,
    .history-title,
    .history-meta {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .guidance-title,
    .history-title {
      font-size: 12px;
      font-weight: 600;
    }

    .guidance-meta,
    .history-meta {
      margin-top: 3px;
      color: #687176;
      font-size: 11px;
    }

    .history-empty {
      padding: 12px;
      color: #687176;
      font-size: 12px;
    }

    .search-result {
      display: block;
      width: 100%;
      padding: 9px 10px;
      border: 0;
      border-bottom: 1px solid #e3e5e6;
      background: #ffffff;
      color: #1f2428;
      text-align: left;
      cursor: pointer;
    }

    .search-result:last-child {
      border-bottom: 0;
    }

    .search-result:hover,
    .search-result:focus {
      background: #f2f6fb;
      outline: none;
    }

    .search-result-title,
    .search-result-address {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .search-result-title {
      font-size: 13px;
      font-weight: 600;
    }

    .search-result-address {
      margin-top: 3px;
      color: #626b70;
      font-size: 11px;
    }

    .search-empty {
      padding: 14px 10px;
      color: #626b70;
      font-size: 12px;
      text-align: center;
    }

    #map,
    #roadview {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    #status-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-height: 0;
      padding: 5px 8px 5px 10px;
      border-top: 1px solid #d7d7d0;
      background: #ffffff;
    }

    #status {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      line-height: 1.35;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #open-history,
    #open-external-viewer {
      flex: 0 0 auto;
      min-height: 28px;
      padding: 4px 9px;
      border-radius: 6px;
      font: inherit;
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
      cursor: pointer;
    }

    #open-external-viewer {
      border: 1px solid #aeb4b8;
      background: #ffffff;
      color: #1f2428;
    }

    #open-external-viewer:hover {
      background: #edf2f7;
    }

    #open-history {
      border: 1px solid #c7a600;
      background: #fee500;
      color: #191919;
    }

    #open-history:hover {
      background: #f4dc00;
    }

    #open-history:disabled,
    #open-external-viewer:disabled {
      cursor: default;
      opacity: 0.5;
    }

    @media (max-width: 980px) {
      #viewer.layout-map-left,
      #viewer.layout-roadview-left {
        grid-template-rows:
          auto
          minmax(0, var(--split-primary-size))
          10px
          minmax(0, 1fr)
          auto;
        grid-template-columns: minmax(0, 1fr);
      }

      #viewer.layout-map-left #map,
      #viewer.layout-roadview-left #roadview {
        grid-row: 2;
        grid-column: 1;
      }

      #viewer.layout-map-left #roadview,
      #viewer.layout-roadview-left #map {
        grid-row: 4;
        grid-column: 1;
      }

      #viewer.layout-map-left #view-splitter,
      #viewer.layout-roadview-left #view-splitter {
        grid-row: 3;
        grid-column: 1;
        cursor: row-resize;
      }

      #search-form {
        grid-template-areas:
          "query submit fullscreen clear"
          "layout layout layout layout";
        grid-template-columns: minmax(0, 1fr) 58px 34px 34px;
      }

      #viewer-layout {
        width: 100%;
      }

      #route-options {
        grid-template-columns: auto minmax(0, 1fr) auto auto;
      }

      #route-add-waypoint {
        grid-column: 2 / -1;
      }

      #route-vehicle-options {
        grid-template-columns: auto minmax(0, 1fr);
      }
    }

    @media (max-width: 760px) {
      #status {
        flex-basis: 100%;
      }
    }

    @media (max-width: 420px) {
      #status-bar {
        align-items: stretch;
        flex-direction: column;
      }

      #route-controls,
      .route-waypoint {
        grid-template-columns: auto minmax(0, 1fr);
      }

      #route-origin-current,
      #route-destination-current,
      #route-actions {
        grid-column: 2;
      }

      #open-history,
      #open-external-viewer {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main id="viewer" class="layout-map-top">
    <header id="search-panel">
      <form id="search-form" role="search">
        <input id="search-query" type="search" aria-label="주소 또는 장소 검색" placeholder="주소 또는 장소 검색" autocomplete="off" disabled>
        <button id="search-submit" type="submit" disabled>검색</button>
        <select id="viewer-layout" aria-label="지도와 로드뷰 배치">

  <script>

  </script>
  <script>
    const kakaoAppKey = __KAKAO_APP_KEY_JSON__;
    const defaultCenter = { lat: 37.566826, lon: 126.9786567 };
    const searchForm = document.getElementById("search-form");
    const searchQuery = document.getElementById("search-query");
    const searchSubmit = document.getElementById("search-submit");
    const searchClear = document.getElementById("search-clear");
    const searchResults = document.getElementById("search-results");
    const viewer = document.getElementById("viewer");
    const viewerLayoutSelect = document.getElementById("viewer-layout");
    const fullscreenToggle = document.getElementById("fullscreen-toggle");
    const viewSplitter = document.getElementById("view-splitter");
    const splitToggle = document.getElementById("split-toggle");
    const routeOriginInput = document.getElementById("route-origin-input");
    const routeDestinationInput = document.getElementById("route-destination-input");
    const routeOriginCurrentButton = document.getElementById("route-origin-current");
    const routeDestinationCurrentButton = document.getElementById("route-destination-current");
    const routePrioritySelect = document.getElementById("route-priority");
    const routeAvoidToggle = document.getElementById("route-avoid-toggle");
    const routeAvoidOptions = document.getElementById("route-avoid-options");
    const routeAvoidCheckboxes = Array.from(
      routeAvoidOptions.querySelectorAll('input[type="checkbox"]')
    );
    const routeVehicleToggle = document.getElementById("route-vehicle-toggle");
    const routeVehicleOptions = document.getElementById("route-vehicle-options");
    const routeCarType = document.getElementById("route-car-type");
    const routeCarFuel = document.getElementById("route-car-fuel");
    const routeCarHipass = document.getElementById("route-car-hipass");
    const routeAddWaypointButton = document.getElementById("route-add-waypoint");
    const routeWaypointsContainer = document.getElementById("route-waypoints");
    const routeCreateButton = document.getElementById("route-create");
    const routeHistoryOpenButton = document.getElementById("route-history-open");
    const routeSwapButton = document.getElementById("route-swap");
    const routeResetButton = document.getElementById("route-reset");
    const routeGuidancePanel = document.getElementById("route-guidance-panel");
    const routeGuidanceTab = document.getElementById("route-guidance-tab");
    const routeHistoryTab = document.getElementById("route-history-tab");
    const routeGuidanceSummaryText = document.getElementById("route-guidance-summary-text");
    const routeGuidanceToggle = document.getElementById("route-guidance-toggle");
    const routeGuidanceList = document.getElementById("route-guidance-list");
    const routeHistoryList = document.getElementById("route-history-list");
    const openExternalViewerButton = document.getElementById("open-external-viewer");
    const routeGuidanceOverview = document.createElement("div");
    routeGuidanceOverview.id = "route-guidance-overview";
    routeGuidanceOverview.setAttribute("aria-label", "현재 경로 지점");
    routeGuidanceOverview.hidden = true;
    routeGuidancePanel.insertBefore(routeGuidanceOverview, routeGuidanceList);
    const maxRouteWaypoints = 5;

    let map = null;
    let marker = null;
    let roadview = null;
    let roadviewClient = null;
    let placesService = null;
    let geocoderService = null;
    let pendingCenter = null;
    let moveRequestId = 0;
    let lastProjectEpoch = null;
    let activeRoutePanelTab = "guidance";
    let qgisBridge = null;
    let mapSyncTimer = null;
    let roadviewSyncTimer = null;
    let roadviewStateTimer = null;
    let stableRelayoutTimers = [];
    let lastRoadviewSize = "";
    let programmaticRoadviewPanoId = null;
    const guidanceController = window.createKakaoGuidanceController({
      document, routeGuidanceList, routeGuidanceSummaryText, routeGuidanceOverview,
      routeGuidancePanel, routeGuidanceToggle,
      getMap: () => map, getMaps: () => kakao.maps, getBridge: () => qgisBridge,
      getActiveTab: () => activeRoutePanelTab, moveViewer, setStatus, formatCoordinate,
      activateRoutePanelTab, updateRoutePanelVisibility, scheduleStableRelayout
    });
    const historyController = window.createKakaoHistoryController({
      document, routeHistoryList, getBridge: () => qgisBridge,
      getActiveTab: () => activeRoutePanelTab, setStatus, renderRouteGuidance,
      formatGuidanceDistance, formatGuidanceDuration, activateRoutePanelTab,
      updateRouteControls, updateRoutePanelVisibility, scheduleStableRelayout
    });
    const searchController = window.createKakaoSearchController({
      document, searchForm, searchQuery, searchSubmit, searchClear, searchResults,
      getServices: () => ({
        placesService, geocoderService,
        status: placesService ? kakao.maps.services.Status : {}
      }),
      setStatus, selectSearchResult
    });
    const routeInputController = window.createKakaoRouteInputController({
      document, ui: { routeOriginInput, routeDestinationInput, routeOriginCurrentButton, routeDestinationCurrentButton, routePrioritySelect, routeAvoidToggle, routeAvoidOptions, routeAvoidCheckboxes, routeVehicleToggle, routeVehicleOptions, routeCarType, routeCarFuel, routeCarHipass, routeAddWaypointButton, routeWaypointsContainer, routeCreateButton, routeHistoryOpenButton, routeSwapButton, routeResetButton, searchResults }, maxRouteWaypoints,
      getMap: () => map, getBridge: () => qgisBridge,
      getServices: () => ({
        placesService, geocoderService,
        status: placesService ? kakao.maps.services.Status : {}
      }),
      search: (...args) => searchController.search(...args),
      cancelSearch: () => searchController.cancel(), timers: window,
      moveViewer, setStatus, formatCoordinate, routeInputLabel, clearRoutePath
    });
    const viewerLayoutStorageKey = "kakao-qgis-viewer-layout";
    const viewerSplitStorageKey = "kakao-qgis-viewer-split";

    function savedViewerLayout() {
      try {
        return window.localStorage.getItem(viewerLayoutStorageKey) || "map-top";
      } catch (_error) {
        return "map-top";
      }
    }

    function relayoutKakaoViews() {
      const mapCenter = map ? map.getCenter() : null;
      if (map && typeof map.relayout === "function") {
        map.relayout();
        if (mapCenter) {
          map.setCenter(mapCenter);
        }
      }
      if (roadview && typeof roadview.relayout === "function") {
        const roadviewElement = document.getElementById("roadview");
        const roadviewSize = `${roadviewElement.clientWidth}x${roadviewElement.clientHeight}`;
        if (roadviewSize !== lastRoadviewSize) {
          lastRoadviewSize = roadviewSize;
          roadview.relayout();
        }
      }
    }

    function scheduleStableRelayout() {
      stableRelayoutTimers.forEach((timer) => window.clearTimeout(timer));
      stableRelayoutTimers = [0, 80, 220, 480].map((delay) => {
        return window.setTimeout(relayoutKakaoViews, delay);
      });
    }

    function isHorizontalSplitLayout(layout = viewerLayoutSelect.value) {
      if (window.matchMedia("(max-width: 980px)").matches) {
        return true;
      }
      return layout === "map-top" || layout === "roadview-top";
    }

    function savedViewerSplit() {
      try {
        const value = Number(window.localStorage.getItem(viewerSplitStorageKey));
        return Number.isFinite(value) ? Math.min(70, Math.max(30, value)) : 50;
      } catch (_error) {
        return 50;
      }
    }

    function applyViewerSplit(percent) {
      const nextPercent = Math.min(70, Math.max(30, Number(percent) || 50));
      viewer.style.setProperty("--split-primary-size", `${nextPercent}%`);
      try {
        window.localStorage.setItem(viewerSplitStorageKey, String(nextPercent));
      } catch (_error) {
        // Ignore private browsing or locked storage.
      }
      scheduleStableRelayout();
    }

    function updateSplitterState(layout = viewerLayoutSelect.value) {
      const horizontal = isHorizontalSplitLayout(layout);
      viewSplitter.setAttribute(
        "aria-orientation",
        horizontal ? "horizontal" : "vertical"
      );
      splitToggle.textContent = horizontal ? "⇅" : "⇄";
    }

    function swappedViewerLayout(layout = viewerLayoutSelect.value) {
      const swaps = {
        "map-top": "roadview-top",
        "roadview-top": "map-top",
        "map-left": "roadview-left",
        "roadview-left": "map-left"
      };
      return swaps[layout] || "map-top";
    }

    async function toggleBrowserFullScreen() {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else if (viewer.requestFullscreen) {
        await viewer.requestFullscreen();
      }
      scheduleStableRelayout();
    }

    function applyViewerLayout(layout) {
      const allowedLayouts = new Set([
        "map-top",
        "roadview-top",
        "map-left",
        "roadview-left"
      ]);
      const nextLayout = allowedLayouts.has(layout) ? layout : "map-top";
      viewer.classList.remove(
        "layout-map-top",
        "layout-roadview-top",
        "layout-map-left",
        "layout-roadview-left"
      );
      viewer.classList.add(`layout-${nextLayout}`);
      viewerLayoutSelect.value = nextLayout;
      updateSplitterState(nextLayout);
      try {
        window.localStorage.setItem(viewerLayoutStorageKey, nextLayout);
      } catch (_error) {
        // Ignore private browsing or locked storage.
      }
      scheduleStableRelayout();
    }

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    function formatGuidanceDistance(distance) {
      return guidanceController.formatDistance(distance);
    }

    function formatGuidanceDuration(duration) {
      return guidanceController.formatDuration(duration);
    }

    function updateRoutePanelVisibility() {
      routeGuidancePanel.hidden =
        !guidanceController.count &&
        !historyController.count &&
        activeRoutePanelTab !== "history";
      updateSplitterState();
      scheduleStableRelayout();
    }

    function activateRoutePanelTab(tabName) {
      activeRoutePanelTab = tabName === "history" ? "history" : "guidance";
      const showingHistory = activeRoutePanelTab === "history";
      routeGuidanceTab.classList.toggle("is-active", !showingHistory);
      routeHistoryTab.classList.toggle("is-active", showingHistory);
      routeGuidanceTab.setAttribute("aria-selected", showingHistory ? "false" : "true");
      routeHistoryTab.setAttribute("aria-selected", showingHistory ? "true" : "false");
      routeGuidanceOverview.hidden =
        showingHistory || !routeGuidanceOverview.childElementCount;
      routeGuidanceList.hidden = showingHistory;
      routeHistoryList.hidden = !showingHistory;
      routeGuidanceSummaryText.textContent = showingHistory
        ? `경로 이력 ${historyController.count}건`
        : routeGuidanceSummaryText.dataset.guidanceSummary || "";
      updateRoutePanelVisibility();
    }

    function renderRouteHistory(payload) {
      return historyController.render(payload);
    }

    function clearRoutePath() {
      return guidanceController.clearPath();
    }

    function renderRouteGuidance(payload) {
      return guidanceController.render(payload);
    }

    function connectQgisBridgeSignals() {
      if (!qgisBridge) {
        return;
      }
      openExternalViewerButton.disabled = false;

      if (qgisBridge.routeStatusChanged) {
        qgisBridge.routeStatusChanged.connect((success, message) => {
          routeInputController.complete();
          updateRouteControls();
          setStatus(message);
        });
      }
      if (qgisBridge.routeGuidanceChanged) {
        qgisBridge.routeGuidanceChanged.connect((payloadJson) => {
          try {
            renderRouteGuidance(JSON.parse(payloadJson));
          } catch (error) {
            renderRouteGuidance({});
            clearRoutePath();
            updateRoutePanelVisibility();
            setStatus("경로 안내 목록을 표시하지 못했습니다.");
          }
        });
      }
      if (qgisBridge.routeHistoryChanged) {
        qgisBridge.routeHistoryChanged.connect((payloadJson) => {
          try {
            renderRouteHistory(JSON.parse(payloadJson));
          } catch (error) {
            renderRouteHistory({ items: [] });
            updateRoutePanelVisibility();
            setStatus("경로 이력 목록을 표시하지 못했습니다.");
          }
        });
      }
      if (qgisBridge.loadRouteHistoryInput) {
        qgisBridge.loadRouteHistoryInput.connect((payloadJson) => {
          try {
            window.loadRouteHistoryInput(JSON.parse(payloadJson));
          } catch (error) {
            setStatus("경로 이력을 입력창으로 불러오지 못했습니다.");
          }
        });
      }
      if (qgisBridge.projectReset) {
        qgisBridge.projectReset.connect((epoch) => {
          if (epoch === lastProjectEpoch) return;
          lastProjectEpoch = epoch;
          routeInputController.reset();
          clearRoutePath();
          updateRouteControls();
        });
      }
    }

    function initQgisBridge() {
      if (window.kakaoExternalBridge) {
        qgisBridge = window.kakaoExternalBridge;
        connectQgisBridgeSignals();
        updateRouteControls();
        setStatus("외부 브라우저 연동 모드로 QGIS와 연결했습니다.");
        qgisBridge.start();
        return;
      }

      if (!window.qt || !window.qt.webChannelTransport || !window.QWebChannel) {
        return;
      }

      new QWebChannel(window.qt.webChannelTransport, (channel) => {
        qgisBridge = channel.objects.qgisBridge;
        connectQgisBridgeSignals();
        updateRouteControls();
      });
    }

    function openExternalViewer() {
      if (qgisBridge && typeof qgisBridge.openExternalViewer === "function") {
        qgisBridge.openExternalViewer();
        return;
      }
      setStatus("외부 브라우저 연동을 아직 사용할 수 없습니다.");
    }

    function formatCoordinate(coordinate) {
      return `${coordinate.lon.toFixed(7)}, ${coordinate.lat.toFixed(7)}`;
    }

    function updateRouteControls() {
      return routeInputController.updateControls();
    }

    function clearRouteInputs(resetOptions = true, notifyQgis = true) {
      return routeInputController.clear(resetOptions, notifyQgis);
    }

    function routeInputLabel(location, fallback) {
      return guidanceController.inputLabel(location, fallback);
    }

    function syncKakaoMapToQgis(updateRoadview = false) {
      const position = map.getCenter();
      const lat = position.getLat();
      const lon = position.getLng();
      marker.setPosition(position);
      // Update locally on drag end; this tab does not receive its own echo.
      if (updateRoadview && roadviewClient && roadview) {
        updateRoadviewPosition(position);
      }

      if (!qgisBridge) {
        setStatus("카카오 지도 위치를 QGIS에 전달할 연결이 아직 준비되지 않았습니다.");
        return;
      }

      qgisBridge.moveQgisCenter(lon, lat);
      setStatus(`카카오 지도 → QGIS EPSG:4326 ${lat.toFixed(6)}, ${lon.toFixed(6)}`);
    }

    function scheduleKakaoMapSync() {
      if (mapSyncTimer !== null) {
        return;
      }

      mapSyncTimer = window.setTimeout(() => {
        mapSyncTimer = null;
        syncKakaoMapToQgis();
      }, 120);
    }

    function syncRoadviewStateToQgis() {
      if (!qgisBridge || !roadview) {
        return;
      }

      const position = roadview.getPosition();
      const viewpoint = roadview.getViewpoint();
      if (!position || !viewpoint) {
        return;
      }

      const lon = position.getLng();
      const lat = position.getLat();
      const pan = Number(viewpoint.pan);
      const tilt = Number(viewpoint.tilt);
      const zoom = Number(viewpoint.zoom);
      if (![lon, lat, pan, tilt, zoom].every(Number.isFinite)) {
        return;
      }

      const panoId = roadview.getPanoId();
      qgisBridge.updateRoadviewState(
        lon,
        lat,
        pan,
        tilt,
        zoom,
        panoId === null || panoId === undefined ? "" : String(panoId)
      );
    }

    function scheduleRoadviewStateSync() {
      if (roadviewStateTimer !== null) {
        return;
      }

      roadviewStateTimer = window.setTimeout(() => {
        roadviewStateTimer = null;
        syncRoadviewStateToQgis();
      }, 100);
    }

    function selectSearchResult(result) {
      map.setLevel(4);
      moveViewer(result.lon, result.lat);
      searchResults.hidden = true;

      if (qgisBridge) {
        qgisBridge.moveQgisCenter(result.lon, result.lat);
      }
      setStatus(`검색 결과 → QGIS EPSG:4326 ${result.lat.toFixed(6)}, ${result.lon.toFixed(6)}`);
    }

    function searchLocal(...args) {
      return searchController.search(...args);
    }

    function loadKakaoScript(appKey) {
      return new Promise((resolve, reject) => {
        if (window.kakao && window.kakao.maps) {
          window.kakao.maps.load(resolve);
          return;
        }

        const script = document.createElement("script");
        script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(appKey)}&autoload=false&libraries=services`;
        script.async = true;
        script.onload = () => window.kakao.maps.load(resolve);
        script.onerror = () => reject(new Error("카카오 지도 API를 불러오지 못했습니다. 네트워크와 JavaScript 키·SDK 도메인 설정을 확인하세요."));
        document.head.appendChild(script);
      });
    }

    function initViewer() {
      const center = new kakao.maps.LatLng(defaultCenter.lat, defaultCenter.lon);

      map = new kakao.maps.Map(document.getElementById("map"), {
        center,
        level: 4
      });

      marker = new kakao.maps.Marker({
        map,
        position: center
      });

      kakao.maps.event.addListener(map, "drag", () => {
        scheduleKakaoMapSync();
      });

      kakao.maps.event.addListener(map, "dragend", () => {
        window.clearTimeout(mapSyncTimer);
        mapSyncTimer = null;
        syncKakaoMapToQgis(true);
      });

      kakao.maps.event.addListener(map, "click", () => {
        searchResults.hidden = true;
      });

      roadview = new kakao.maps.Roadview(document.getElementById("roadview"));
      roadviewClient = new kakao.maps.RoadviewClient();
      placesService = new kakao.maps.services.Places();
      geocoderService = new kakao.maps.services.Geocoder();
      searchQuery.disabled = false;
      searchSubmit.disabled = false;
      routeOriginInput.disabled = false;
      routeDestinationInput.disabled = false;
      routeOriginCurrentButton.disabled = false;
      routeDestinationCurrentButton.disabled = false;
      routePrioritySelect.disabled = false;
      routeAddWaypointButton.disabled = false;
      updateRouteControls();
      document.getElementById("open-history").disabled = false;

      kakao.maps.event.addListener(roadview, "position_changed", () => {
        scheduleRoadviewStateSync();

        const panoId = roadview.getPanoId();
        if (programmaticRoadviewPanoId === panoId) {
          programmaticRoadviewPanoId = null;
          return;
        }
        programmaticRoadviewPanoId = null;

        const position = roadview.getPosition();
        if (!position) {
          return;
        }

        const lat = position.getLat();
        const lon = position.getLng();
        map.setCenter(position);
        marker.setPosition(position);

        window.clearTimeout(roadviewSyncTimer);
        roadviewSyncTimer = window.setTimeout(() => {
          if (!qgisBridge) {
            setStatus("로드뷰 위치를 QGIS에 전달할 연결이 아직 준비되지 않았습니다.");
            return;
          }

          qgisBridge.moveQgisCenter(lon, lat);
          setStatus(`로드뷰 → QGIS EPSG:4326 ${lat.toFixed(6)}, ${lon.toFixed(6)}`);
        }, 200);
      });

      kakao.maps.event.addListener(roadview, "viewpoint_changed", () => {
        scheduleRoadviewStateSync();
      });

      kakao.maps.event.addListener(roadview, "panoid_changed", () => {
        scheduleRoadviewStateSync();
      });

      kakao.maps.event.addListener(roadview, "init", () => {
        scheduleRoadviewStateSync();
      });

      setStatus("준비되었습니다. QGIS·카카오 지도·로드뷰 위치 동기화가 활성화되었습니다.");
      moveViewer(defaultCenter.lon, defaultCenter.lat);
      if (guidanceController.payload) {
        renderRouteGuidance(guidanceController.payload);
      }
      scheduleStableRelayout();

      if (pendingCenter) {
        moveViewer(pendingCenter.lon, pendingCenter.lat);
        pendingCenter = null;
      }
    }

    viewerLayoutSelect.addEventListener("change", () => {
      applyViewerLayout(viewerLayoutSelect.value);
    });

    fullscreenToggle.addEventListener("click", async () => {
      if (qgisBridge && typeof qgisBridge.toggleFullScreen === "function") {
        await qgisBridge.toggleFullScreen();
        scheduleStableRelayout();
        return;
      }

      try {
        await toggleBrowserFullScreen();
      } catch (_error) {
        setStatus("전체화면 전환을 사용할 수 없습니다.");
      }
    });

    document.addEventListener("fullscreenchange", () => {
      fullscreenToggle.textContent = document.fullscreenElement ? "⛶" : "⛶";
      scheduleStableRelayout();
    });

    splitToggle.addEventListener("click", (event) => {
      event.stopPropagation();
      applyViewerLayout(swappedViewerLayout());
    });

    viewSplitter.addEventListener("pointerdown", (event) => {
      if (event.target === splitToggle) {
        return;
      }
      event.preventDefault();
      viewSplitter.setPointerCapture(event.pointerId);

      const updateSplitFromPointer = (pointerEvent) => {
        const rect = viewer.getBoundingClientRect();
        const horizontal = isHorizontalSplitLayout();
        const headerHeight = searchForm.closest("header").offsetHeight;
        const footerHeight = document.getElementById("status-bar").offsetHeight;
        const available = horizontal
          ? Math.max(1, rect.height - headerHeight - footerHeight)
          : Math.max(1, rect.width);
        const offset = horizontal
          ? pointerEvent.clientY - rect.top - headerHeight
          : pointerEvent.clientX - rect.left;
        applyViewerSplit((offset / available) * 100);
      };

      const stopDrag = (pointerEvent) => {
        viewSplitter.releasePointerCapture(pointerEvent.pointerId);
        viewSplitter.removeEventListener("pointermove", updateSplitFromPointer);
        viewSplitter.removeEventListener("pointerup", stopDrag);
        viewSplitter.removeEventListener("pointercancel", stopDrag);
        scheduleStableRelayout();
      };

      viewSplitter.addEventListener("pointermove", updateSplitFromPointer);
      viewSplitter.addEventListener("pointerup", stopDrag);
      viewSplitter.addEventListener("pointercancel", stopDrag);
      updateSplitFromPointer(event);
    });

    window.addEventListener("resize", () => {
      updateSplitterState();
      scheduleStableRelayout();
    });

    window.addEventListener("focus", scheduleStableRelayout);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        scheduleStableRelayout();
      }
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", scheduleStableRelayout);
      window.visualViewport.addEventListener("scroll", scheduleStableRelayout);
    }

    if (window.ResizeObserver) {
      const viewerResizeObserver = new ResizeObserver(() => {
        updateSplitterState();
        scheduleStableRelayout();
      });
      [
        viewer,
        document.getElementById("search-panel"),
        document.getElementById("map"),
        document.getElementById("roadview")
      ].forEach((element) => {
        if (element) {
          viewerResizeObserver.observe(element);
        }
      });
    }

    document.getElementById("open-history").addEventListener("click", () => {
      const position = roadview && roadview.getPosition()
        ? roadview.getPosition()
        : map && map.getCenter();
      if (!position || !qgisBridge) {
        setStatus("카카오 로드뷰 링크가 아직 준비되지 않았습니다.");
        return;
      }

      qgisBridge.openKakaoRoadview(position.getLng(), position.getLat());
    });

    openExternalViewerButton.addEventListener("click", openExternalViewer);

    routeGuidanceToggle.addEventListener("click", () => {
      const collapsed = routeGuidancePanel.dataset.collapsed === "true";
      routeGuidancePanel.dataset.collapsed = collapsed ? "false" : "true";
      routeGuidanceToggle.textContent = collapsed ? "−" : "+";
      const label = collapsed ? "경로 안내 접기" : "경로 안내 펼치기";
      routeGuidanceToggle.title = label;
      routeGuidanceToggle.setAttribute("aria-label", label);
    });

    routeGuidanceTab.addEventListener("click", () => {
      activateRoutePanelTab("guidance");
    });

    routeHistoryTab.addEventListener("click", () => {
      activateRoutePanelTab("history");
    });

    routeHistoryOpenButton.addEventListener("click", () => {
      if (qgisBridge && qgisBridge.refreshRouteHistory) {
        qgisBridge.refreshRouteHistory();
      }
      routeGuidancePanel.dataset.collapsed = "false";
      routeGuidanceToggle.textContent = "−";
      routeGuidanceToggle.title = "경로 안내 접기";
      routeGuidanceToggle.setAttribute("aria-label", "경로 안내 접기");
      activateRoutePanelTab("history");
      routeGuidancePanel.scrollIntoView({ block: "nearest" });
      setStatus(historyController.count ? "경로 이력을 열었습니다." : "경로 이력을 확인하고 있습니다.");
    });

    function moveViewer(lon, lat) {
      const position = new kakao.maps.LatLng(lat, lon);
      map.setCenter(position);
      marker.setPosition(position);
      updateRoadviewPosition(position);
    }

    function updateRoadviewPosition(position) {
      const requestId = ++moveRequestId;
      const lon = position.getLng();
      const lat = position.getLat();
      roadviewClient.getNearestPanoId(position, 80, (panoId) => {
        if (requestId !== moveRequestId) {
          return;
        }

        if (panoId) {
          programmaticRoadviewPanoId = panoId;
          roadview.setPanoId(panoId, position);
          setStatus(`EPSG:4326 ${lat.toFixed(6)}, ${lon.toFixed(6)} · 로드뷰를 불러왔습니다.`);
        } else {
          setStatus(`EPSG:4326 ${lat.toFixed(6)}, ${lon.toFixed(6)} · 주변에 로드뷰 촬영 지점이 없습니다.`);
        }
      });
    }

    window.setKakaoBridgeStatus = setStatus;

    window.centerKakaoMap = function centerKakaoMap(lon, lat) {
      if (!Number.isFinite(lon) || !Number.isFinite(lat)) {
        setStatus("QGIS에서 받은 좌표가 올바르지 않습니다.");
        return;
      }

      if (!map || !roadviewClient) {
        pendingCenter = { lon, lat };
        setStatus(`카카오 API 준비 대기 중 · EPSG:4326 ${lat.toFixed(6)}, ${lon.toFixed(6)}`);
        return;
      }

      moveViewer(lon, lat);
    };

    window.loadRouteHistoryInput = (payload) => routeInputController.load(payload);

    applyViewerSplit(savedViewerSplit());
    applyViewerLayout(savedViewerLayout());
    initQgisBridge();

    if (!kakaoAppKey) {
      setStatus("플러그인 메뉴의 JavaScript API 키 설정 또는 KAKAO_MAP_JAVASCRIPT_KEY 환경변수에 키를 입력하세요.");
    } else {
      loadKakaoScript(kakaoAppKey)
        .then(initViewer)
        .catch((error) => setStatus(error.message));
    }
  </script>
</body>
</html>
